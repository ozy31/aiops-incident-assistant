[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiops-incident-assistant"
version = "0.1.0"
description = "Enrich Alertmanager alerts with logs, metrics and Kubernetes context, then ask an LLM for a structured incident summary."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmet Ozan Gazi" }]
requires-python = ">=3.12"
keywords = ["aiops", "alertmanager", "loki", "prometheus", "incident-response", "llm", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "anthropic>=2.0,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27,<1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "typer>=0.12",
]

[project.optional-dependencies]
k8s = ["kubernetes>=30.1"]
dev = [
  "kubernetes>=30.1",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
aiops-assist = "aiops_assistant.cli:app"

[project.urls]
Repository = "https://github.com/ozy31/aiops-incident-assistant"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aiops_assistant"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
