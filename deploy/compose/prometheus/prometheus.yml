global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: checkout-api
    static_configs:
      - targets: ["log-generator:8000"]
        labels:
          namespace: demo
  - job_name: aiops-assistant
    static_configs:
      - targets: ["assistant:8080"]
