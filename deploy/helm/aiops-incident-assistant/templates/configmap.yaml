apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiops.fullname" . }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  AIOPS_{{ $key }}: {{ $value | quote }}
  {{- end }}
  AIOPS_K8S_ENABLED: {{ .Values.kubernetesContext.enabled | quote }}
  AIOPS_LOG_FORMAT: "json"
